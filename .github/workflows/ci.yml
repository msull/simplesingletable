name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.10"   # floor of requires-python = ">=3.10" in pyproject.toml
  UV_VERSION: "0.7.18"     # the uv this workflow was verified with; bump deliberately

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      # Fails if pyproject.toml changed without re-running `uv lock`.
      - name: uv.lock is up to date
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      # Same tools and targets as `inv lint` (tasks.py:95-99), in check mode.
      - name: black
        run: uv run --frozen black --check src/ tasks.py
      - name: isort
        run: uv run --frozen isort --check-only src/ tasks.py
      - name: ruff
        run: uv run --frozen ruff check src/ tasks.py

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      # pytest-docker brings up tests/docker-compose.yml (DynamoDB Local + MinIO) itself
      # via `docker compose`; ubuntu-latest ships Docker and the Compose v2 plugin.
      - name: pytest
        run: uv run --frozen pytest
