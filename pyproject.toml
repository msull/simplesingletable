[build-system]
requires = ["setuptools>=61.0.0,<69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "simplesingletable"
version = "20.0.0"
description = "A simple boto3/Pydantic implementation of DynamoDB Single Table Design and related utilities."
readme = "README.md"
authors = [{ name = "Sully", email = "sully@sadburger.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
]
keywords = ["dynamodb", "singletabledesign"]
requires-python = ">=3.10"
dependencies = [
    "boto3",
    "humanize",
    "pydantic>2",
    "typing-extensions",
    "ulid-py",
]

[project.optional-dependencies]
dev = [
    "black",
    "boto3-stubs[dynamodb]",
    "bumpver",
    "invoke",
    "isort",
    "logzero",
    "pip-tools",
    "pytest",
    "pytest-cov",
    "pytest-docker",
    "pytest-mock",
    "ruff>=0.16,<0.17",  # rule set is version-sensitive; see [tool.ruff.lint]
    "streamlit",
    "streamlit-extras",
    "tabulate",
    "watchdog",
]
build = [
    "build",
    "twine",
]

[project.urls]
Homepage = "https://github.com/msull/simplesingletable"

[tool.isort]
profile = "black"
line_length = 120

[tool.black]
line-length = 120
# Pinned for the same reason as ruff: without it black infers a target from the
# source and warned it was formatting for py3.15 while running on 3.12.
target-version = ["py310"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# This project lints against ruff's DEFAULT rule set (413 rules as of 0.16), which is
# why `ruff` is version-pinned in the dev extra: the default set widened substantially
# in 0.16 and silently turned `inv lint` from passing into 575 errors on an unchanged
# codebase. Pinning makes a rule-set change a deliberate upgrade rather than a surprise.
# The set is not enumerated here because doing so would mean listing all 413 codes.


[tool.bumpver]
current_version = "20.0.0"
version_pattern = "MAJOR.MINOR.PATCH"
commit_message = "Bump version {old_version} -> {new_version}"
commit = true
tag = true
push = false

[tool.bumpver.file_patterns]
"pyproject.toml" = ['current_version = "{version}"', 'version = "{version}"']
"src/simplesingletable/__init__.py" = ['package_version = "{version}"']
"README.md" = ["**Latest Version:** {version}"]


[tool.pytest.ini_options]
addopts = """
-v -p no:warnings --no-header --durations=3 --strict-markers
--cov-report=html:coverage_report --cov=simplesingletable
-m "not benchmark"
"""
pythonpath = ["src/"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "benchmark: marks tests as benchmarks for performance comparison (deselect with '-m \"not benchmark\"')",
]

[tool.coverage.report]
exclude_lines = [
    "if TYPE_CHECKING:",
    "if __name__ == \"__main__\"",
]
