version: '2'
services:
  dynamodb:
    image: amazon/dynamodb-local
    ports:
      - 8000
  
  minio:
    # minio/minio was withdrawn from Docker Hub (pulls are denied); Chainguard publishes a
    # free, pullable build whose entrypoint is the minio binary. It ships no curl, so there is
    # no compose healthcheck: the minio_via_docker fixture polls /minio/health/live instead.
    image: cgr.dev/chainguard/minio:latest
    ports:
      - 9000
      - 9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
